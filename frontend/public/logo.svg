<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="ketrix-grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="ketrix-grad2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <filter id="ketrix-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <g filter="url(#ketrix-glow)">
    <!-- Vertical Bar | -->
    <rect x="25" y="25" width="12" height="70" rx="3" fill="url(#ketrix-grad1)" />
    
    <!-- Angled Bracket > -->
    <path d="M 45 25 L 85 60 L 45 95 L 60 95 L 100 60 L 60 25 Z" fill="url(#ketrix-grad2)" />
    
    <!-- Central Node / Quantum State -->
    <circle cx="70" cy="60" r="8" fill="#ffffff" opacity="0.9" />
  </g>
</svg>
